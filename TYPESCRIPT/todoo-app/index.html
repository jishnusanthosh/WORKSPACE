<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>TypeScript Todo App</title>
  </head>

  <body>
    <div class="container">
      <h1>Todo App</h1>

      <form id="new-task-form">
        <input
          type="text"
          id="new-task-title"
          placeholder="Enter a task"
          autocomplete="off"
        />

        <button type="submit">
          Add Task
        </button>
      </form>

      <ul id="list"></ul>
    </div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
