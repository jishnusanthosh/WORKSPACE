<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Spotify Clone</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <!-- NAVBAR -->

  <header class="top-navbar">

    <div class="logo">
      <i class="bi bi-spotify"></i>
    </div>

    <div class="nav-center">

      <button
        class="home-button"
        type="button"
      >
        <i class="bi bi-house-door-fill"></i>
      </button>

      <div class="search-box">

        <i class="bi bi-search"></i>

        <input
          type="text"
          placeholder="What do you want to play?"
        >

      </div>

    </div>

    <div class="nav-right">

      <span>Premium</span>
      <span>Support</span>
      <span>Download</span>

      <button
        class="signup-button"
        type="button"
      >
        Sign up
      </button>

      <button
        class="login-button"
        type="button"
      >
        Log in
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="app-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="library-header">

        <h2>Your Library</h2>

        <button
          class="create-button"
          type="button"
        >
          <i class="bi bi-plus-lg"></i>
          Create
        </button>

      </div>


      <div class="library-card">

        <h3>
          Create your first playlist
        </h3>

        <p>
          It's easy, we'll help you
        </p>

        <button type="button">
          Create playlist
        </button>

      </div>


      <div class="library-card">

        <h3>
          Let's find some podcasts to follow
        </h3>

        <p>
          We'll keep you updated on new episodes
        </p>

        <button type="button">
          Browse podcasts
        </button>

      </div>

    </aside>


    <!-- MAIN CONTENT -->

    <section class="main-content">


      <!-- TRENDING -->

      <section class="content-section">

        <div class="section-header">
          <h2>Trending songs</h2>
        </div>

        <div
          class="song-row"
          id="trendingSongRow"
        ></div>

      </section>


      <!-- ARTISTS -->

      <section class="content-section">

        <div class="section-header">
          <h2>Popular artists</h2>
        </div>

        <div
          class="artist-row"
          id="artistRow"
        ></div>

      </section>


      <!-- ALBUMS -->

      <section class="content-section">

        <div class="section-header">
          <h2>Popular albums and singles</h2>
        </div>

        <div
          class="song-row"
          id="albumRow"
        ></div>

      </section>

    </section>

  </main>


  <!-- MUSIC PLAYER -->

  <div class="music-player">

    <!-- EMPTY UNTIL SONG SELECTED -->

    <div
      class="player-song-info"
      id="playerSongInfo"
    ></div>


    <!-- CENTER PLAYER -->

    <div class="player-center">

      <div class="player-controls">

        <button
          class="player-control-btn"
          id="previousBtn"
          type="button"
        >
          <i class="bi bi-skip-start-fill"></i>
        </button>


        <button
          class="main-play-btn"
          id="playPauseBtn"
          type="button"
        >
          <i class="bi bi-play-fill"></i>
        </button>


        <button
          class="player-control-btn"
          id="nextBtn"
          type="button"
        >
          <i class="bi bi-skip-end-fill"></i>
        </button>

      </div>


      <!-- PROGRESS -->

      <div class="player-progress">

        <span id="currentTime">
          0:00
        </span>

        <input
          type="range"
          id="progressBar"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <!-- VOLUME -->

    <div class="player-volume">

      <i class="bi bi-volume-up"></i>

      <input
        type="range"
        id="volumeBar"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

    </div>

  </div>


  <!-- AUDIO -->

  <audio
    id="audioPlayer"
    preload="metadata"
  ></audio>


  <script src="./js/app.js"></script>

</body>
</html>
